olor:var(--p);box-shadow:0 0 0 4px var(--gl)}.sol-l{display:grid;gap:14px;margin-top:16px}.sol{border-left:4px solid var(--p)}.sol.pend{border-left-color:var(--wa);box-shadow:0 0 0 1px var(--wa),var(--sh)}.sol.done{border-left-color:var(--ok)}.sol-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.sol-h b{font-size:16px}.sol-m{color:var(--mut);font-size:12.5px;margin-top:2px}.sol-tx{white-space:pre-wrap;word-break:break-word;margin:12px 0}.sol-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.sol-ch{padding:3px 11px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--hv);border:1px solid var(--bd)}.sol-ch.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}.sol-ch.pe{color:var(--wa);border-color:color-mix(in srgb,var(--wa) 45%,transparent)}</style></head><body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="/wa.js"></script><script>
const API='/api';
const SO_WA=/^\/whats\/?$/i.test(location.pathname);
if(SO_WA){window.WA_SOLO={sair:()=>{const b=document.querySelector('[data-a="out"]');if(b)b.click()},tema:()=>{const b=document.querySelector('[data-a="th"]');if(b)b.click()}};document.title='WhatsApp · Meet Call'}
const KEY='ac_op';

const TIPOS=['À vista','Parcelado','Renegociação','Quitação','Boleto','Pix'],
COOPERATIVAS=['Transpocred','Credforce','Crevisk'],
FECHADO_POR=['WhatsApp','Discador','Zap2Go'],
ST={prazo:'No prazo',pago:'Sim (Pago)',quebra:'Quebra',aberto:'Aberto'};
const $=(s,e=document)=>e.querySelector(s),
esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),
dt=s=>s?esc(String(s).split('-').reverse().join('/')):'',
hoje=()=>new Date().toLocaleDateString('sv-SE'),
sum=L=>L.reduce((s,a)=>s+(+a.valor||0),0),
mcpf=v=>v.replace(/\D/g,'').slice(0,11).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');

let me=null,cred=null,A=[],NM=[],last='',busy=false,timer=null,tab='reg',fl='todos',q='',sidebarCollapsed=(()=>{try{return localStorage.getItem('ac_sb')==='1'}catch(e){return false}})();
let pend=null,solPend=-1,qb='',BASE=[],baseSig='',baseLim=200,baseOk=false,bSort={k:'',d:1},bFilt={coop:'',garantia:''};
const app=$('#app'),
fil=()=>A.filter(a=>(fl==='todos'||a.status===fl)&&(!q||(a.nome+' '+a.cpf+' '+String(a.cpf).replace(/\D/g,'')+' '+a.coop).toLowerCase().includes(q)));

function mtel(v){const d=v.replace(/\D/g,'').slice(0,11);if(!d)return '';if(d.length<=2)return '('+d;if(d.length<=6)return '('+d.slice(0,2)+') '+d.slice(2);if(d.length<=10)return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7)}
let cpfSeq=0;
const nk=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
async function buscaCpf(v){
 const d=v.replace(/\D/g,''),h=$('#cpf_hint');if(!h)return;
 if(d.length!==11){cpfSeq++;h.textContent='';return}
 const seq=++cpfSeq;h.style.color='var(--mut)';h.textContent='🔎 Buscando na base…';
 try{const j=await api('buscacpf',{cpf:d});if(seq!==cpfSeq||!$('#cpf_hint'))return;
  const L=j.achou||[];if(!L.length){h.textContent='Cliente não encontrado na base — preencha os dados manualmente.';return}
  const b=L[0],n=$('#f2'),t=$('#f_tel'),c=$('#f6'),td=String(b.tel||'').replace(/\D/g,'');
  if(n)n.value=b.nome||b.razao||'';
  if(t&&(td.length===10||td.length===11))t.value=mtel(td);
  if(c&&b.coop){let o=[...c.options].find(x=>x.value&&nk(x.value)===nk(b.coop))||[...c.options].find(x=>x.value&&(nk(x.value).includes(nk(b.coop))||nk(b.coop).includes(nk(x.value))));if(!o){o=new Option(b.coop,b.coop);c.add(o)}c.value=o.value}
  h.style.color='var(--ok)';
  h.innerHTML='✅ Encontrado na base: <b>'+esc(b.nome||b.razao)+'</b> · '+esc(b.coop||'—')+' · '+(+b.atraso||0)+' dias em atraso · saldo '+brl(b.saldo)+(L.length>1?' · '+L.length+' registros desse CPF':'')}
 catch(x){if(seq===cpfSeq&&$('#cpf_hint'))h.textContent=''}}
function toast(m,bad){const t=document.createElement('div');t.className='tt'+(bad?' bad':'');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)}
function setN(id,t,m){const e=$('#'+id);if(!e)return;const a=e._v||0,s=performance.now();e._v=t;(function f(n){const k=Math.min(1,(n-s)/700),v=a+(t-a)*(1-Math.pow(1-k,3));e.textContent=m?brl(v):Math.round(v);if(k<1)requestAnimationFrame(f)})(s)}
function mm(e){const n=e.value.replace(/\D/g,'');e.dataset.v=(+n||0)/100;e.value=n?brl(n/100):''}
const errMsg=x=>/failed to fetch|networkerror|load failed/i.test(x.message)?'Sem conexão com o servidor':x.message;

async function api(action,extra){
 const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,login:cred.login},cred.token?{token:cred.token}:{senha:cred.senha},extra||{}))});
 const j=await r.json();if(!j.ok){if(/Sess[aã]o expirada/.test(j.erro||''))sessaoExpirou();throw new Error(j.erro||'Erro no servidor')}return j}
function sessaoExpirou(){me=null;cred=null;last='';solPend=-1;SOL=[];solSig='';BASE=[];baseSig='';baseOk=false;clearInterval(timer);try{localStorage.removeItem(KEY)}catch(x){}loginView();toast('Sessão expirada. Entre novamente.',1)}
function apply(j,force){
 if(j.solPend!=null)setBadge(j.solPend);
 const s=JSON.stringify([j.acordos,j.nomes]);if(!force&&s===last)return;last=s;
 A=j.acordos.map(a=>Object.assign({},a,{valor:+a.valor||0,valorParc:+a.valorParc||0,qtdParc:+a.qtdParc||1,criadoEm:+a.criadoEm||0})).sort((a,b)=>b.criadoEm-a.criadoEm);
 NM=j.nomes.slice().sort((a,b)=>String(a).localeCompare(String(b)));
 if(me)fill()}
async function run(action,extra,okMsg){
 if(busy)return false;busy=true;
 try{const j=await api(action,extra);apply(j,1);if(okMsg)toast(okMsg);return true}
 catch(x){toast(errMsg(x),1);return false}

 if(busy)return;busy=true;
 try{const j=await api('basemsg',{id}),b=BASE.find(x=>x.id===id);if(b){b.msgPor=j.msgPor;b.msgEm=j.msgEm;baseSig=JSON.stringify(BASE)}toast('Mensagem marcada como enviada!');fBase()}
 catch(x){toast(errMsg(x),1)}
 finally{busy=false}}

async function save(){
 const g=i=>$('#f'+i)?.value.trim()||'';
 const tipo=$('#f3').value;
 const o={
  operador:me.nome,
  cpf:g(1),
  nome:g(2),
  telefone:$('#f_tel')?.value.trim()||'',
  tipo:tipo,
  valor:+$('#f4')?.dataset.v||0,
  qtdParc:tipo==='Parcelado'?(+$('#f_qtd_parc')?.value||1):1,
  valorParc:tipo==='Parcelado'?(+$('#f_val_parc')?.dataset.v||0):0,
  venc:g(5),
  coop:$('#f6')?.value||'',
  fechado:g(7),
  ativo:g(8)
 };
 if(!o.cpf||!o.nome||!o.tipo||!o.venc||!o.coop||!o.fechado||o.cpf.replace(/\D/g,'').length!==11||(o.telefone&&!/^\d{10,11}$/.test(o.telefone.replace(/\D/g,''))))return toast('Preencha todos os campos corretamente',1);
 if(tipo==='Parcelado'&&(o.qtdParc<2||o.valorParc<=0))return toast('Parcelado: informe a quantidade de parcelas (2 ou mais) e o valor da parcela',1);
 const bt=$('#bsave');if(bt)bt.disabled=true;
 let dia=hoje();if(retro){dia=$('#f_dia')?.value||'';if(!/^\d{4}-\d{2}-\d{2}$/.test(dia)||dia>hoje())return toast('Informe a data do acordo (não pode ser futura)',1)}
 const wasRetro=retro;
 if(await run('save',{d:o,dia:dia},(tipo==='Parcelado'?'Acordo registrado e enviado ao Preventivo! 🎉':'Acordo registrado com sucesso! 🎉'))){if(wasRetro){retro=false;go('plan')}else go('reg')}else if(bt)bt.disabled=false}

app.addEventListener('click',async e=>{const b=e.target.closest('[data-a],[data-t],[data-f],[data-pf],[data-sendmsg],[data-del],[data-more],[data-bh],[data-sci]');if(!b){bMenuFechar();return}const d=b.dataset;
if(d.bh)return bMenu(d.bh);
if(d.a==='retro'){retro=true;return go('reg')}
if(d.t){bMenuFechar();retro=false;return go(d.t)}
if(d.pf){pf=d.pf;return fPrev()}
if(d.f){fl=d.f;return fill()}
if(d.sendmsg)return marcarMensagemEnviada(d.sendmsg);
if(d.more){baseLim+=200;return fBase()}
if(d.sci){if(pend!==b){pend=b;b.textContent='Clique de novo para confirmar';setTimeout(()=>{if(pend===b){pend=null;b.textContent='✅ Li e dou ciência'}},3000);return}pend=null;b.disabled=true;try{solApply(await api('sol_ciente',{id:d.sci}),1);toast('Ciência registrada ✅')}catch(x){toast(errMsg(x),1);b.disabled=false}return}
if(d.del){if(pend!==b){pend=b;b.textContent='Confirmar?';setTimeout(()=>{if(pend===b){pend=null;b.textContent='🗑'}},3000);return}pend=null;return void await run('del',{id:d.del},'Acordo excluído')}
if(d.a==='toggleSidebar'){sidebarCollapsed=!sidebarCollapsed;try{localStorage.setItem('ac_sb',sidebarCollapsed?'1':'0')}catch(x){}const lay=$('#mainLayout');if(lay)lay.classList.toggle('collapsed',sidebarCollapsed);return}
if(d.a==='out'){me=null;cred=null;last='';solPend=-1;SOL=[];solSig='';A=[];NM=[];BASE=[];baseSig='';baseOk=false;clearInterval(timer);try{localStorage.removeItem(KEY)}catch(x){}return loginView()}
if(d.a==='th'){const r=document.documentElement,dk=(r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))==='dark';r.dataset.theme=dk?'light':'dark';return}
if(d.a==='save')return save()});
app.addEventListener('change',async e=>{const s=e.target.dataset.s;if(!s)return;if(!await run('status',{id:s,status:e.target.value},'Status atualizado'))fill()});
app.addEventListener('input',e=>{const t=e.target;if(t.id==='f1'){t.value=mcpf(t.value);buscaCpf(t.value)}if(t.id==='f_tel')t.value=mtel(t.value);if(t.id==='ocpf')t.value=mcpf(t.value);if(t.id==='pqb'){pq=t.value.trim().toLowerCase();fPrev()}if(t.id==='f4'||t.id==='f_val_parc'){mm(t)}if(t.id==='bq'){q=t.value.trim().toLowerCase();fill()}if(t.id==='bqb'){qb=t.value.trim().toLowerCase();baseLim=200;fBase()}});

addEventListener('keydown',e=>{if(e.key==='Escape')bMenuFechar()});addEventListener('resize',bMenuFechar);document.addEventListener('scroll',e=>{if(!e.target.closest||!e.target.closest('#bmenu'))bMenuFechar()},true);
(async()=>{loginView();
 let c=null;try{c=JSON.parse(localStorage.getItem(KEY))}catch(x){}
 if(c){busy=true;try{cred=c;const j=await api('login');if(j.token){cred.token=j.token;try{localStorage.setItem(KEY,JSON.stringify(cred))}catch(e){}}if(j.me.role!=='op')throw 0;me=j.me;apply(j,1);if(SO_WA)tab='wa';else if(j.solPend>0)tab='sol';shell();iniciar()}catch(x){cred=null;me=null}finally{busy=false}}})();
